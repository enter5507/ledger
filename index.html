label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}

:root{--bg:#F6ECDF;--surface:#FFFBF4;--ink:#4B3527;--mute:#8C7767;--line:#EADBC8;--pri:#8B5E3C;--onpri:#FFF8EE;--inc:#5B7D4E;--exp:#B4533C;--gold:#F4C46B;--ongold:#4B3527;--scrim:rgba(60,40,25,.45);color-scheme:light}

:root[data-theme="dark"]{--bg:#241B15;--surface:#2E231B;--ink:#F3E6D5;--mute:#B7A28F;--line:#45362A;--pri:#D9B38C;--onpri:#2A1D14;--inc:#9CC28F;--exp:#E58A73;--gold:#E3B35A;--ongold:#2A1D14;--scrim:rgba(0,0,0,.6);color-scheme:dark}

.chip small{flex:0 0 auto;font-size:11px;color:var(--mute)}

<body>
<main>
  <div class="nav">
    <button class="ib" id="prev" aria-label="上個月">‹</button>
    <div style="text-align:center"><h1 id="mlabel"></h1><button class="link" id="back" hidden>回到本月</button></div>
    <button class="ib" id="next" aria-label="下個月">›</button>
  </div>
  <div class="acct" id="acct"></div>
  <div class="banner" id="banner" hidden>這個瀏覽器無法儲存資料，關閉頁面後記錄會消失。</div>
  <div id="view"></div>
</main>
<button class="btn fab" id="fab"><span class="pl">＋</span><span class="lb"> 記一筆</span></button>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GKEY='ledger-step1',SEEN='ledger-step1-seen';let KEY=GKEY;
let S={accounts:[],records:[]},storeOK=true,kind='out';
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
let ym=today().slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let curDetail=null,retTo=null,splits=[],ppOn=false,sortSec='';
function doneForm(){const r=retTo;closeSheet();if(r)setTimeout(r,0)}
function delRec(id){const r=S.records.find(x=>x.id===id);if(!r)return;S.records=r.grp?S.records.filter(x=>x.grp!==r.grp):S.records.filter(x=>x.id!==id)}
const rcur=v=>v.cur||(acc(v.acc)||{}).cur||'TWD';
const r2=n=>Math.round(n*100)/100;
const num=n=>n.toLocaleString('zh-TW',{maximumFractionDigits:2});
const money=(n,c)=>`${c} ${num(n)}`;
/* ===== 雲端登入與儲存（Supabase）===== */
const SB_URL='https://wgqlhsgtrplfudmudthf.supabase.co',SB_KEY='sb_publishable_38FCtfvgyOD9BnOJJWD0jg_Pc957i-J';
let SB=null;try{if(window.supabase)SB=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
const AUTHKEY='sb-'+SB_URL.split('//')[1].split('.')[0]+'-auth-token';
let user=null,sync='local',cloudTs=null,pushT=null,pushing=false,ready=false,loggingOut=false,pending=null;
const ukey=id=>'ledger-u-'+id,mkey=id=>'ledger-u-'+id+'-meta';
const same=(a,b)=>!!a&&!!b&&new Date(a).getTime()===new Date(b).getTime();
const isAuthErr=e=>!!e&&(e.status===401||/jwt|not authenticated/i.test(e.message||''));
function readLS(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){storeOK=false;return null}}
function norm(){S.accounts=S.accounts||[];S.records=S.records||[];S.budgets=S.budgets||[];S.cards=S.cards||[];S.reserves=S.reserves||[];S.settled=S.settled||{};S.rates=S.rates||{};S.prepaid=S.prepaid||[];S.advOrder=S.advOrder||[]}
const meta=()=>(user&&readLS(mkey(user.id)))||{ts:null,dirty:false};
function setMeta(m){try{localStorage.setItem(mkey(user.id),JSON.stringify(m))}catch(e){}}
const hasData=d=>!!d&&((d.accounts||[]).length>0||(d.records||[]).length>0);
const cnt=d=>`${((d&&d.accounts)||[]).length} 個帳戶、${((d&&d.records)||[]).length} 筆記錄`;
{const u=readLS(AUTHKEY);if(u&&u.user&&u.user.id){user={id:u.user.id,email:u.user.email||''};KEY=ukey(user.id);sync='saving'}}
S=readLS(KEY)||{accounts:[],records:[]};norm();

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storeOK=false}
  if(user){const m=meta();m.dirty=true;setMeta(m);pushSoon()}
}
function syncText(){return {saved:'已同步到雲端',saving:'同步中…',error:'目前無法上傳，記錄先存在這支手機，連上網路後會自動上傳',expired:'登入已過期，請重新登入',local:''}[sync]||''}
function drawAcct(){
  const el=$('#acct');if(!el)return;
  if(!user){el.innerHTML=`<span>未登入・資料只在這支手機</span><button class="link" data-a="login">登入／註冊</button>`;return}
  const t={saved:'☁ 已同步',saving:'☁ 同步中…',error:'⚠ 尚未上傳，會自動重試',expired:'⚠ 登入已過期'}[sync]||'';
  el.innerHTML=`<span>${esc(user.email)}　${t}</span><button class="link" data-a="${sync==='expired'?'login':'acct'}">${sync==='expired'?'重新登入':'帳號'}</button>`;
}
function pushSoon(d){
  if(sync!=='expired'){sync='saving';drawAcct()}
  clearTimeout(pushT);pushT=setTimeout(push,d===undefined?900:d);
}
async function push(){
  if(!user||!SB||!ready||pushing||sync==='expired')return;
  if(typeof navigator!=='undefined'&&navigator.onLine===false){sync='error';drawAcct();return}
  pushing=true;clearTimeout(pushT);
  const snap=JSON.stringify(S),ts=new Date().toISOString();
  let conflict=false;
  try{
    if(cloudTs){
      const r=await SB.from('ledger_data').update({data:JSON.parse(snap),updated_at:ts}).eq('user_id',user.id).eq('updated_at',cloudTs).select('updated_at');
      if(r.error)throw r.error;
      if(!r.data||!r.data.length)conflict=true;
    }else{
      const r=await SB.from('ledger_data').insert({user_id:user.id,data:JSON.parse(snap),updated_at:ts});
      if(r.error){if(r.error.code==='23505')conflict=true;else throw r.error}
    }
    if(!conflict){
      cloudTs=ts;const m=meta();m.ts=ts;
      if(JSON.stringify(S)===snap){m.dirty=false;sync='saved'}else{sync='saving';pushT=setTimeout(push,300)}
      setMeta(m);
    }
  }catch(e){sync=isAuthErr(e)?'expired':'error';if(sync==='error')pushT=setTimeout(push,15000)}
  pushing=false;drawAcct();
  if(conflict){ready=false;conflictFromPush()}
}
async function conflictFromPush(){
  try{
    const r=await SB.from('ledger_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();
    if(r.error)throw r.error;
    if(!r.data){cloudTs=null;ready=true;push();return}
    conflictSheet(r.data);
  }catch(e){ready=true;sync=isAuthErr(e)?'expired':'error';drawAcct();if(sync==='error')pushT=setTimeout(push,15000)}
}
function applyCloud(row){
  S=(row.data&&typeof row.data==='object')?row.data:{};norm();cloudTs=row.updated_at;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storeOK=false}
  setMeta({ts:cloudTs,dirty:false});ready=true;sync='saved';drawAcct();render();
}
async function initSync(){
  if(!user){sync='local';drawAcct();return}
  if(!SB){sync='error';drawAcct();return}
  sync='saving';drawAcct();
  try{
    const r=await SB.from('ledger_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();
    if(r.error)throw r.error;
    const row=r.data,m=meta();
    if(!row){
      cloudTs=null;
      const g=readLS(GKEY);
      if(hasData(g)&&!hasData(S)){guestSheet(g);return}
      ready=true;await push();return;
    }
    cloudTs=row.updated_at;
    if(m.dirty&&!same(m.ts,row.updated_at)){conflictSheet(row);return}
    if(m.dirty){ready=true;await push();return}
    applyCloud(row);
  }catch(e){
    sync=isAuthErr(e)?'expired':'error';drawAcct();
    if(sync==='error')setTimeout(initSync,15000);
  }
}
function guestSheet(g){
  pending={type:'guest',g};
  openSheet(`<h3>發現這支手機上有記錄</h3><p>這是你還沒登入時記的資料（${cnt(g)}）。要放進剛登入的帳號嗎？</p><p class="sub">放進去之後，這份資料就屬於這個帳號，會存到雲端。</p><div class="acts" style="flex-direction:column"><button class="btn" data-a="guestup">放進這個帳號</button><button class="btn alt" data-a="guestno">不要，這個帳號從空白開始</button></div>`,true);
}
function conflictSheet(row){
  pending={type:'conflict',row};
  openSheet(`<h3>兩邊的資料不一樣</h3><p>雲端有另一份資料（${cnt(row.data)}），可能是你用另一支手機或電腦記的；這台裝置也有尚未上傳的記錄（${cnt(S)}）。只能留下其中一份：</p><div class="acts" style="flex-direction:column"><button class="btn" data-a="useCloud">用雲端的資料<br><small>這台未上傳的記錄會消失</small></button><button class="btn alt" data-a="useLocal">用這台的資料覆蓋雲端<br><small>雲端那份會被取代</small></button></div>`,true);
}
function showPending(){
  if(!pending)return;
  if(pending.type==='conflict')conflictSheet(pending.row);else guestSheet(pending.g);
}
async function refresh(manual){
  if(!user||!SB||!ready||pushing)return;
  if(sync==='expired'){if(manual)loginSheet('in');return}
  if(meta().dirty){await push();return}
  try{
    const r=await SB.from('ledger_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();
    if(r.error)throw r.error;
    if(r.data&&!same(r.data.updated_at,cloudTs)&&!meta().dirty){if(manual||$('#sheet').hidden)applyCloud(r.data)}
    else if(manual){sync='saved';drawAcct()}
  }catch(e){if(isAuthErr(e))sync='expired';else if(manual)sync='error';drawAcct()}
}

function authMsg(e){
  const m=(e&&e.message)||'';
  if(/invalid login credentials/i.test(m))return 'Email 或密碼不對。';
  if(/already registered|already been registered/i.test(m))return '這個 Email 已經註冊過了，請改按「登入」。';
  if(/at least 6|weak password/i.test(m))return '密碼至少要 6 個字。';
  if(/rate limit|too many/i.test(m))return '操作太頻繁，請等幾分鐘再試。';
  if(/not confirmed/i.test(m))return '這個 Email 還沒驗證，請先到信箱點驗證連結。';
  if(/failed to fetch|network|load failed/i.test(m))return '連線失敗，請確認網路後再試。';
  if(/signups? not allowed|signup is disabled/i.test(m))return '目前不開放註冊新帳號。';
  return '發生錯誤：'+m;
}

async function doAuth(k,t){
  const email=$('#l-mail').value.trim().toLowerCase(),pw=$('#l-pw').value,er=$('#err');
  er.style.color='';
  if(!/^\S+@\S+\.\S+$/.test(email)){er.textContent='請輸入正確的 Email。';return}
  if(pw.length<6){er.textContent='密碼至少要 6 個字。';return}
  if(!SB){er.textContent='無法連線到雲端服務，請確認網路後重新整理頁面。';return}
  t.disabled=true;er.textContent='';
  try{
    const r=k==='up'?await SB.auth.signUp({email,password:pw}):await SB.auth.signInWithPassword({email,password:pw});
    if(r.error)throw r.error;
    if(!r.data||!r.data.session){er.textContent='註冊成功，請到信箱點驗證連結後，再回來登入。';t.disabled=false;return}
    await onLogin(r.data.session.user);
  }catch(e){er.textContent=authMsg(e);t.disabled=false}
}
async function onLogin(u){

}
async function doForgot(t){
  const email=$('#l-mail').value.trim().toLowerCase(),er=$('#err');er.style.color='';
  if(!/^\S+@\S+\.\S+$/.test(email)){er.textContent='請先在上面輸入你的 Email，再按「忘記密碼」。';return}
  if(!SB){er.textContent='無法連線到雲端服務，請確認網路後重新整理頁面。';return}
  t.disabled=true;
  try{
    const r=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(r.error)throw r.error;
    er.style.color='var(--inc)';er.textContent='已寄出重設密碼的信，請到信箱點連結。';
  }catch(e){er.textContent=authMsg(e)}
  t.disabled=false;
}

async function doNewPw(t){

async function doLogout(t){
  if(!t.dataset.forced&&meta().dirty){
    t.textContent='上傳中…';t.disabled=true;await push();t.disabled=false;
    if(meta().dirty){t.dataset.forced='1';t.textContent='還有記錄沒上傳成功，登出會遺失，再按一次確認';return}
  }
  loggingOut=true;clearTimeout(pushT);
  try{if(SB)await SB.auth.signOut({scope:'local'})}catch(e){}
  try{localStorage.removeItem(AUTHKEY);localStorage.removeItem(ukey(user.id));localStorage.removeItem(mkey(user.id))}catch(e){}
  user=null;KEY=GKEY;cloudTs=null;ready=false;pending=null;sync='local';
  S=readLS(GKEY)||{accounts:[],records:[]};norm();
  loggingOut=false;closeSheet();drawAcct();
}
function authAct(a,t){
  switch(a){
    case 'login':try{localStorage.setItem(SEEN,'1')}catch(x){}loginSheet('in');return true;
    case 'signup':loginSheet('up');return true;
    case 'doin':doAuth('in',t);return true;
    case 'doup':doAuth('up',t);return true;
    case 'forgot':doForgot(t);return true;
    case 'dopw':doNewPw(t);return true;
    case 'acct':acctSheet();return true;
    case 'syncnow':refresh(true).then(()=>{if(user&&!$('#sheet').hidden)acctSheet()});return true;
    case 'logout':doLogout(t);return true;
    case 'useCloud':{const row=pending.row;pending=null;applyCloud(row);closeSheet();return true}
    case 'useLocal':{const row=pending.row;pending=null;cloudTs=row.updated_at;ready=true;closeSheet();push();return true}
    case 'guestup':{const g=pending.g;pending=null;S=JSON.parse(JSON.stringify(g));norm();ready=true;cloudTs=null;save();try{localStorage.removeItem(GKEY)}catch(e){}closeSheet();return true}
    case 'guestno':pending=null;ready=true;cloudTs=null;closeSheet();push();return true;
  }
  return false;
}

const prevYM=y=>{let [a,b]=y.split('-').map(Number);b--;if(!b){b=12;a--}return `${a}-${pad(b)}`};
const baseFor=(b,y)=>{const k=Object.keys(b.base).filter(x=>x<=y).sort().pop();return k?b.base[k]:0};
function bstat(b,y){
  if(y<b.start)return null;
  const base=baseFor(b,y),adj=r2(b.adj.filter(x=>x.date.slice(0,7)===y).reduce((s,x)=>s+x.amt,0));
  const p=bstat(b,prevYM(y)),carry=p?Math.min(0,p.left):0;
  const spent=r2(S.records.filter(r=>(r.type==='out'||r.type==='advi'||r.type==='ppu')&&r.bud===b.id&&r.date.slice(0,7)===y).reduce((s,r)=>s+r.amt*(r.rate||1),0));
  return {base,adj,carry,spent,left:r2(base+adj+carry-spent)};
}

  else if(a==='ovpsave')ovpSave(id,t.dataset.rid,t);

  else if(a==='ovdel'){const r0=S.records.find(x=>x.id===id);if(!r0)return;const cc=S.cards.find(x=>x.id===r0.card);if(t.dataset.armed){if(r0.type==='ovp'&&r2(cinfo(cc).ov-r0.amt)<0){$('#err').textContent='已經抵扣過一部分，請先刪除抵扣記錄。';return}S.records=S.records.filter(x=>x.id!==id);save();cardSheet(r0.card)}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='sort'){sortSec=sortSec===id?'':id;render()}
  else if(a==='mvup'||a==='mvdn')moveItem(t.dataset.sec,id,a==='mvup'?-1:1);
  else if(a==='spadd'){splits.push({who:'',amt:''});$('#split-wrap').innerHTML=splitHtml();{const pw=$('#pp-wrap');if(pw)pw.innerHTML=ppHtml()}const ins=document.querySelectorAll('#split-wrap [data-f="who"]');if(ins.length)ins[ins.length-1].focus()}
  else if(a==='spdel'){splits.splice(+id,1);$('#split-wrap').innerHTML=splitHtml();{const pw=$('#pp-wrap');if(pw)pw.innerHTML=ppHtml()}}
  else if(a==='speq'){const tt=totalAmt();if(!(tt>0)){$('#err').textContent='請先輸入總金額。';return}const n=splits.length+1,sh=Math.floor(tt/n*100)/100;splits.forEach(s=>{s.amt=sh});$('#split-wrap').innerHTML=splitHtml()}
  else if(a==='edit')editRec(id);
  else if(a==='close')doneForm();
  else if(a==='saverec')saveRec(id,t);
  else if(a==='addacc')addAcc();
  else if(a==='seen'){try{localStorage.setItem(SEEN,'1')}catch(x){}closeSheet();maybeSettle()}
  else if(a==='delrec'&&!t.dataset.armed&&pastRec(id)){t.dataset.armed='1';t.textContent='再按一次確認刪除';$('#err').textContent=WARN}
  else if(a==='delrec'){
    if(t.dataset.armed){delRec(id);save();doneForm()}
    else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='xnew')xferSheet();
  else if(a==='xsave')xSave(id,t);
  else if(a==='xdel'){if(t.dataset.armed){S.records=S.records.filter(r=>r.id!==id);save();doneForm()}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='anew')advSheet('advi');
  else if(a==='advsave')advSave(t.dataset.t,id,t);
  else if(a==='advdel'){if(t.dataset.armed){S.records=S.records.filter(r=>r.id!==id);save();doneForm()}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='adv')advPerson(t.dataset.w,t.dataset.c);
  else if(a==='advrep'){const o=advSum().find(x=>x.who===t.dataset.w&&x.cur===t.dataset.c);advSheet(o&&o.v<0?'reps':'repr',null,{who:t.dataset.w,amt:o?Math.abs(o.v):'',date:today(),note:'',acc:'',cur:t.dataset.c})}
  else if(a==='advnew'){const c=t.dataset.c,lr=[...S.records].reverse().find(x=>x.acc&&acc(x.acc)&&acc(x.acc).cur===c);recSheet(null,{who:t.dataset.w,amt:'',item:'',rsv:'',acc:lr?lr.acc:((S.accounts.find(x=>!x.hidden&&x.cur===c)||{}).id||'')})}
  else if(a==='msettle'){settleSkip=false;const M=pendingSettle();if(M)settleSheet(M);else openSheet(`<h3>月底結算</h3><p>目前沒有需要結算的月份。只有已經過去的月份、而且預算還有剩餘時，才會出現。</p><div class="acts"><button class="btn" data-a="close">關閉</button></div>`)}
  else if(a==='bstart')bStart(id);
  else if(a==='rvlog')rvLogSheet(id,t.dataset.lid);
  else if(a==='rvlsave')rvLogSave(id,t.dataset.lid);
  else if(a==='rvldel'){if(t.dataset.armed){const v=S.reserves.find(x=>x.id===id);v.log=v.log.filter(l=>l.id!==t.dataset.lid);save();rsvSheet(id)}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='rsvedit')rsvEdit(id);
  else if(a==='rsvupd'){const nm=$('#rv-name').value.trim();if(!nm){$('#err').textContent='請輸入項目名稱。';return}S.reserves.find(x=>x.id===id).name=nm;save();rsvSheet(id)}
  else if(a==='rsvdel'){if(t.dataset.armed){const v=S.reserves.find(x=>x.id===id),ac=v.acc;S.records.forEach(r=>{if(r.rsv===id)r.rsv=''});S.reserves=S.reserves.filter(x=>x.id!==id);save();if(ac)accDetail(ac);else closeSheet()}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='rsv')rsvSheet(id);
  else if(a==='rsvnew')rsvNew(id,t.dataset.c);
  else if(a==='rsvsave')rsvSave(id,t.dataset.c);
  else if(a==='rsvmove')rsvMoveSheet(id,t.dataset.c);else if(a==='rsvmvall'){const cs=[...document.querySelectorAll('.mvck')],all=cs.every(c=>c.checked);cs.forEach(c=>c.checked=!all)}
  else if(a==='rsvmovego')rsvMoveGo(id,t.dataset.c);
  else if(a==='rvadd')rsvAct(id,'add');
  else if(a==='rvrel')rsvAct(id,'rel');
  else if(a==='rvuse')rsvAct(id,'use');
  else if(a==='settleskip'){settleSkip=true;closeSheet();maybeRemind()}
  else if(a==='settledo')settleDo(id);
  else if(a==='accd')accDetail(id);
  else if(a==='cnew')cardForm();
  else if(a==='cedit')cardForm(id);
  else if(a==='csave')cSave(id);
  else if(a==='card'){id?cardSheet(id):closeSheet()}
  else if(a==='cdel'){if(t.dataset.armed){S.records=S.records.filter(r=>r.card!==id);S.cards=S.cards.filter(c=>c.id!==id);save();closeSheet()}else{t.dataset.armed='1';t.textContent='連同卡片記錄一起刪除，再按一次'}}
  else if(a==='rew'){const c=S.cards.find(x=>x.id===id),v=r2(parseFloat($('#rw-'+t.dataset.w).value.replace(/,/g,'')));if(v>0)c.rew[t.dataset.ck]=v;else delete c.rew[t.dataset.ck];save();cardSheet(id)}
  else if(a==='pay')paySheet(id);
  else if(a==='paysave')paySave(id,t.dataset.rid,t);
  else if(a==='paydel'&&!t.dataset.armed&&pastRec(id)){t.dataset.armed='1';t.textContent='再按一次確認刪除';$('#err').textContent=WARN}
  else if(a==='paydel'){if(t.dataset.armed){const cid=(S.records.find(r=>r.id===id)||{}).card;S.records=S.records.filter(r=>r.id!==id);save();if(cid)cardSheet(cid);else closeSheet()}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='adje')adjSheet(id,t.dataset.aid);
  else if(a==='bback')bSheet(id);
  else if(a==='adjsave')adjSave(id,t.dataset.aid,t);
  else if(a==='adjdel'){if(t.dataset.armed){const b=S.budgets.find(x=>x.id===id);b.adj=b.adj.filter(x=>x.id!==t.dataset.aid);save();bSheet(id)}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='bnew')bNew();
  else if(a==='bsave')bSave();
  else if(a==='bud')bSheet(id);
  else if(a==='bbase')bBase(id,t);
  else if(a==='badj')bAdj(id,t);
  else if(a==='bdel'){
    if(t.dataset.armed){S.budgets=S.budgets.filter(x=>x.id!==id);S.records.forEach(r=>{if(r.bud===id)r.bud=''});save();closeSheet()}
    else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='editacc')accEdit(id);
  else if(a==='saveacc')accSaveEdit(id,t);
  else if(a==='hideacc'){const x=acc(id);x.hidden=!x.hidden;save();accSheet()}
  else if(a==='delacc'){
    if(t.dataset.armed){S.accounts=S.accounts.filter(x=>x.id!==id);S.records=S.records.filter(r=>r.acc!==id&&r.to!==id);S.reserves=S.reserves.filter(v=>v.acc!==id);save();accSheet()}
    else{t.dataset.armed='1';t.textContent=+t.dataset.n?`連同 ${t.dataset.n} 筆記錄一起刪除，再按一次確認`:'再按一次確認刪除'}}
  else if(a==='swdel'&&!t.dataset.armed&&pastRec(id)){t.dataset.armed='1';t.textContent='影響後續月份，再按一次確認'}
  else if(a==='swdel'){
    if(t.dataset.armed){delRec(id);save();render()}
    else{t.dataset.armed='1';t.textContent='再按一次確認'}}
});
let justSwiped=0,sx=0,sy=0,cur=null,moved=false;
function closeSw(s){s.classList.remove('open');const d=s.querySelector('.del');d.textContent='刪除';delete d.dataset.armed}
document.addEventListener('touchstart',e=>{const s=e.target.closest('.sw');
  document.querySelectorAll('.sw.open').forEach(o=>{if(o!==s)closeSw(o)});
  if(!s){cur=null;return}cur=s;sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false},{passive:true});
document.addEventListener('touchmove',e=>{if(!cur)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
  if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy))moved=true},{passive:true});
document.addEventListener('touchend',e=>{if(!cur)return;
  if(moved){const dx=e.changedTouches[0].clientX-sx;justSwiped=Date.now();
    if(dx<-40)cur.classList.add('open');else if(dx>40)closeSw(cur)}
  cur=null},{passive:true});
document.addEventListener('input',e=>{const el=e.target;if(el&&el.dataset&&el.dataset.sp!==undefined){const s=splits[+el.dataset.sp];if(s){s[el.dataset.f]=el.value;const o=$('#sp-own');if(o)o.innerHTML=ownTxt();fillBud()}}else if(el&&el.id==='f-amt'){const o=$('#sp-own');if(o)o.innerHTML=ownTxt();fillBud()}});
$('#scrim').addEventListener('click',()=>{if(!$('#sheet').dataset.lock)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden&&!$('#sheet').dataset.lock)closeSheet()});
drawAcct();render();notice();if($('#sheet').hidden)maybeSettle();initSync();
if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script>
