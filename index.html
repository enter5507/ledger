<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>記帳</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F3;--surface:#FFFFFF;--ink:#14232B;--mute:#5B6C73;--line:#D3DCDF;--pri:#1F6F78;--onpri:#FFFFFF;--inc:#25774A;--exp:#B23A48;--scrim:rgba(10,20,25,.45);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1F;--surface:#18272E;--ink:#E7EFF1;--mute:#94A6AD;--line:#2B3E46;--pri:#58B5BF;--onpri:#0F1A1F;--inc:#6FCB93;--exp:#EE7C89;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A1F;--surface:#18272E;--ink:#E7EFF1;--mute:#94A6AD;--line:#2B3E46;--pri:#58B5BF;--onpri:#0F1A1F;--inc:#6FCB93;--exp:#EE7C89;--scrim:rgba(0,0,0,.6);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:12px 16px 110px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
.nav h1{font-size:20px;margin:0;font-weight:700}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px}
.link{background:none;border:0;color:var(--pri);padding:6px 0;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--mute);font-weight:500}
.cur{padding:6px 0}.cur+.cur{border-top:1px solid var(--line)}
.code{font-size:13px;color:var(--mute);margin-right:8px}
.big{font-size:30px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;width:100%;background:none;border:0;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row small{display:block;color:var(--mute);font-size:13px}
.amt{font-weight:700;white-space:nowrap}
.in{color:var(--inc)}.out{color:var(--exp)}
.day{font-size:13px;color:var(--mute);margin:14px 4px 4px}
.empty p{margin:0 0 12px}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:12px;padding:12px 18px;font-weight:700;min-height:44px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--exp);border:1px solid var(--exp)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.25);padding:14px 22px;border-radius:28px}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-sizing:border-box}
.sheet h3{margin:0 0 12px;font-size:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;background:transparent;padding:10px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--onpri)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
input.money{font-size:26px;font-weight:700}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
.err{color:var(--exp);font-size:14px;min-height:20px;margin-top:8px}
.banner{background:var(--exp);color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.sw{position:relative;overflow:hidden;border-radius:14px;margin-bottom:6px}
.sw .del{position:absolute;right:0;top:0;bottom:0;width:96px;background:var(--exp);color:var(--bg);border:0;font-weight:700;padding:0 6px;font-size:14px}
.sw .card{margin:0;position:relative;transition:transform .15s}
.sw.open .card{transform:translateX(-96px)}
.amt.pay,.amt.xfer,.amt.advo,.amt.advi,.amt.repr,.amt.reps{color:var(--mute)}
.acts input{flex:1}
[hidden]{display:none!important}
:root{--bg:#F6ECDF;--surface:#FFFBF4;--ink:#4B3527;--mute:#8C7767;--line:#EADBC8;--pri:#8B5E3C;--onpri:#FFF8EE;--inc:#5B7D4E;--exp:#B4533C;--gold:#F4C46B;--ongold:#4B3527;--scrim:rgba(60,40,25,.45);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241B15;--surface:#2E231B;--ink:#F3E6D5;--mute:#B7A28F;--line:#45362A;--pri:#D9B38C;--onpri:#2A1D14;--inc:#9CC28F;--exp:#E58A73;--gold:#E3B35A;--ongold:#2A1D14;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241B15;--surface:#2E231B;--ink:#F3E6D5;--mute:#B7A28F;--line:#45362A;--pri:#D9B38C;--onpri:#2A1D14;--inc:#9CC28F;--exp:#E58A73;--gold:#E3B35A;--ongold:#2A1D14;--scrim:rgba(0,0,0,.6);color-scheme:dark}
body{letter-spacing:.01em;font-variant-numeric:tabular-nums}
.card{border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 28px -20px rgba(90,60,35,.45);padding:16px 18px}
.card h2{font-size:12px;letter-spacing:.12em;margin:0 0 10px}
.ib{border:0;border-radius:14px;box-shadow:0 6px 16px -10px rgba(90,60,35,.5)}
.nav h1{font-weight:500;letter-spacing:.04em}
.btn{border-radius:14px}
.sheet{border-radius:24px 24px 0 0}
input,select{border-radius:12px}
.fab{background:var(--gold);color:var(--ongold);border-radius:30px;padding:15px 24px;font-size:16px;box-shadow:0 12px 28px -10px rgba(120,80,30,.65);transition:padding .15s}
.fab .pl{font-size:20px;line-height:1;font-weight:700}
.fab.mini{padding:15px 18px}.fab.mini .lb{display:none}
.ov .ovh{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 8px}
.code{font-size:15px;font-weight:700;color:var(--pri);letter-spacing:.08em}
.ar{display:block;width:100%;background:none;border:0;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.ar.tot{border-top:0;padding-top:2px}
.an{margin-bottom:6px}.an b{font-size:15px}
.figs{display:flex;gap:22px;align-items:flex-end}
.fg span{display:block;font-size:11px;color:var(--mute);letter-spacing:.08em}
.fg b{font-size:20px;font-weight:700}
.fg.sm b{font-size:14px;font-weight:500;color:var(--mute)}
.fg.neg b{color:var(--exp)}
.cap{font-size:12px;color:var(--mute);margin:12px 0 0;letter-spacing:.1em}
.acct{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin:-4px 2px 10px;letter-spacing:.02em}
.acct .link{font-size:13px;padding:2px 0;white-space:nowrap}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.85}
</style>

const cl=(c,y,m)=>`${y}-${pad(m)}-${pad(Math.min(c.close,new Date(y,m,0).getDate()))}`;

function xSave(id,t){const from=$('#x-from').value,to=$('#x-to').value,amt=r2(parseFloat($('#x-amt').value.replace(/,/g,''))),date=$('#x-date').value||today(),note=$('#x-note').value.trim(),f=acc(from),t2=acc(to);
  if(from===to){$('#err').textContent='轉出和轉入不能是同一個帳戶。';return}
  if(!(amt>0)){$('#err').textContent='請輸入大於 0 的轉出金額。';return}
  let amt2=amt;if(f.cur!==t2.cur){amt2=r2(parseFloat($('#x-amt2').value.replace(/,/g,'')));if(!(amt2>0)){$('#err').textContent='請輸入收到的實際金額。';return}}
  const od=id?S.records.find(x=>x.id===id).date:date;if(pastGuard(t,od<date?od:date))return;
  const o={type:'xfer',acc:from,to,amt,amt2,date,item:f.cur===t2.cur?'轉帳':'換匯',note,bud:'',cur:f.cur};
  if(id)Object.assign(S.records.find(x=>x.id===id),o);else S.records.push({id:uid(),...o});
  if(f.cur==='TWD'&&t2.cur!=='TWD')S.rates[t2.cur]=Math.round(amt/amt2*1e6)/1e6;else if(t2.cur==='TWD'&&f.cur!=='TWD')S.rates[f.cur]=Math.round(amt2/amt*1e6)/1e6;
  save();closeSheet()}
function advSum(){const m={};S.records.forEach(r=>{if(!ADV.includes(r.type))return;const k=r.who+'|'+r.cur,o=m[k]=m[k]||{who:r.who,cur:r.cur,v:0};
  o.v=r2(o.v+(r.type==='advo'||r.type==='reps'?r.amt:-r.amt))});return Object.values(m)}
function advSheet(type,id,pre){const r=id?S.records.find(x=>x.id===id):null,v=pre||(r?{who:r.who,amt:r.amt,date:r.date,note:r.note||'',acc:r.acc,cur:r.cur}:{who:'',amt:'',date:today(),note:'',acc:'',cur:'TWD'});
  const title={advo:'我幫他人代墊',advi:'他人幫我代墊',repr:'對方還款給我',reps:'我還款給對方'}[type],needAcc=type!=='advi';
  const rep=type==='repr'||type==='reps';
  const list=S.accounts.filter(a=>(!a.hidden||a.id===v.acc)&&(!rep||a.cur===v.cur)).sort((a,b)=>(b.cur===v.cur)-(a.cur===v.cur)),sel=v.acc||(list[0]||{}).id;
  const names=[...new Set(S.records.filter(x=>x.who).map(x=>x.who))];
  openSheet(`<h3>${title}</h3>${(type==='advo'||type==='advi')&&!id?`<div class="seg"><button data-ad="advo" aria-pressed="${type==='advo'}">我幫他人代墊</button><button data-ad="advi" aria-pressed="${type==='advi'}">他人幫我代墊</button></div>`:''}<p class="sub">${type==='advo'?'你先付了錢，帳戶會減少，但不算你的支出和預算。':type==='advi'?'對方先付了錢，你的帳戶不會變動，只記一筆「你欠對方」。':type==='repr'?'對方還錢給你，帳戶會增加。':'你還錢給對方，帳戶會減少。'}</p><label for="ad-who">對象</label><input id="ad-who" list="ad-names" value="${esc(v.who)}"><datalist id="ad-names">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><label for="ad-amt">金額</label><input class="money" id="ad-amt" inputmode="decimal" value="${v.amt}">`+(needAcc?`<label for="ad-acc">帳戶${rep?`（${v.cur}）`:''}</label><select id="ad-acc">${list.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}（${a.cur}）</option>`).join('')}</select>`:`<label for="ad-cur">幣別</label><select id="ad-cur">${CURS.map(c=>`<option ${c===v.cur?'selected':''}>${c}</option>`).join('')}</select>`)+`<label for="ad-date">日期</label><input type="date" id="ad-date" value="${v.date}"><label for="ad-note">備註（選填）</label><input id="ad-note" value="${esc(v.note)}"><div class="err" id="err"></div><div class="acts"><button class="btn alt" data-a="close">取消</button>${r?`<button class="btn danger" data-a="advdel" data-id="${r.id}">刪除</button>`:''}<button class="btn" data-a="advsave" data-t="${type}" data-id="${id||''}">儲存</button></div>`)}
function advVals(){return {who:$('#ad-who').value,amt:$('#ad-amt').value,date:$('#ad-date').value,note:$('#ad-note').value,acc:$('#ad-acc')?$('#ad-acc').value:'',cur:$('#ad-cur')?$('#ad-cur').value:'TWD'}}
function advSave(type,id,t){const who=$('#ad-who').value.trim(),amt=r2(parseFloat($('#ad-amt').value.replace(/,/g,''))),date=$('#ad-date').value||today(),note=$('#ad-note').value.trim(),needAcc=type!=='advi',accId=needAcc&&$('#ad-acc')?$('#ad-acc').value:'';
  if(!who){$('#err').textContent='請輸入對象。';return}
  if(!(amt>0)){$('#err').textContent='請輸入大於 0 的金額。';return}
  if(needAcc&&!accId){$('#err').textContent='找不到可用的帳戶，請先建立同幣別的帳戶。';return}
  const cur=needAcc?acc(accId).cur:$('#ad-cur').value;
  const od=id?S.records.find(x=>x.id===id).date:date;if(pastGuard(t,od<date?od:date))return;
  const base={advo:`代墊給 ${who}`,advi:`${who} 代墊`,repr:`${who} 還款`,reps:`還款給 ${who}`}[type],item=base+(note?`：${note}`:'');
  const o={type,amt,acc:accId,card:'',date,item,who,cur,note,bud:''};
  if(id)Object.assign(S.records.find(x=>x.id===id),o);else S.records.push({id:uid(),...o});
  save();closeSheet()}
function advPerson(who,cur){const rs=S.records.filter(r=>ADV.includes(r.type)&&r.who===who&&r.cur===cur).sort((a,b)=>b.date.localeCompare(a.date)),o=advSum().find(x=>x.who===who&&x.cur===cur)||{v:0};
  openSheet(`<h3>${esc(who)}</h3><p class="sub">${o.v>0?`${esc(who)} 欠我 ${cur} ${num(o.v)}`:o.v<0?`我欠 ${esc(who)} ${cur} ${num(-o.v)}`:'已結清'}</p><div class="acts"><button class="btn" data-a="advrep" data-w="${esc(who)}" data-c="${cur}">${o.v<0?'我還款':'對方還款'}</button><button class="btn alt" data-a="advnew" data-w="${esc(who)}" data-c="${cur}">再記一筆代墊</button></div><h3 style="margin-top:18px">明細</h3>`+rs.map(r=>`<button class="row" data-a="edit" data-id="${r.id}"><div><b>${esc(r.item)}</b><small>${r.date}</small></div><div class="amt ${r.type}">${sg(r)}${num(r.amt)}</div></button>`).join('')+`<div class="acts"><button class="btn alt" data-a="close">關閉</button></div>`)}
function ovHtml(rows,tot){
  const fg=(l,v,c)=>`<div class="fg ${c||''}"><span>${l}</span><b>${num(r2(v))}</b></div>`;
  const figs=(e,n)=>fg('實際',e)+fg('盈餘',e-n,e-n<0?'neg':'')+fg('應有',n,'sm');
  return `<div class="card"><h2>所有帳戶合計</h2>`+Object.keys(tot).map(c=>{const t=tot[c],rs=rows.filter(x=>x.a.cur===c),need=rs.reduce((s,x)=>s+x.due+x.res,0);
    return `<div class="ov"><div class="ovh"><span class="code">${c}</span><span class="sub">本月收入 <span class="in">+${num(r2(t.mi))}</span>　支出（含刷卡） <span class="out">−${num(r2(t.mo))}</span></span></div><div class="ar tot"><div class="an"><b>總計</b></div><div class="figs">${figs(t.end,need)}</div></div><p class="cap">各帳戶剩餘</p>`+rs.map(x=>`<button class="ar" data-a="accd" data-id="${x.a.id}"><div class="an"><b>${esc(x.a.name)}</b></div><div class="figs">${figs(x.end,x.due+x.res)}</div></button>`).join('')+`</div>`}).join('<div style="height:14px"></div>')+`<button class="link" data-a="accs">管理帳戶</button></div>`}
function nxtClose(c,k){let y=+k.slice(0,4),m=+k.slice(5,7)+1;if(m>12){m=1;y++}return cl(c,y,m)}
let remindDone=false;
function maybeRemind(){if(remindDone)return;remindDone=true;const t=today(),mo=t.slice(0,7);
  const due=S.cards.filter(c=>c.pay&&cl({close:c.pay},+t.slice(0,4),+t.slice(5,7))===t&&!S.records.some(r=>r.type==='pay'&&r.card===c.id&&r.date.slice(0,7)===mo)&&cinfo(c).out>0);
  if(!due.length)return;
  openSheet(`<h3>今天是繳費日</h3><p class="sub">這個月還沒有繳款記錄。</p>`+due.map(c=>`<div class="row"><div><b>${esc(c.name)}</b><small>未繳總計 ${num(cinfo(c).out)} ${c.cur||'TWD'}</small></div><button class="btn" style="padding:8px 14px" data-a="pay" data-id="${c.id}">去繳款</button></div>`).join('')+`<div class="acts"><button class="btn alt" data-a="close">稍後再說</button></div>`)}
function spendHtml(b){const rs=S.records.filter(r=>r.type==='out'&&r.bud===b.id&&r.date.slice(0,7)===ym).sort((p,q)=>q.date.localeCompare(p.date));
  return `<h3 style="margin-top:14px">本月花費明細</h3>`+(rs.length?rs.map(r=>{const a=acc(r.acc),cd=S.cards.find(c=>c.id===r.card),cu=a?a.cur:cd?(cd.cur||'TWD'):'TWD';return `<button class="row" data-a="edit" data-id="${r.id}"><div><b>${esc(r.item)}</b><small>${r.date}　${a?esc(a.name):cd?'信用卡 '+esc(cd.name):''}</small></div><div class="amt out">−${num(r.amt)} <small style="display:inline">${cu}</small>${cu!=='TWD'&&r.rate?`<small>≈ ${num(r2(r.amt*r.rate))} TWD</small>`:''}</div></button>`}).join(''):`<p class="sub">這個月還沒有花費。</p>`)+`<div class="row"><b>本月花費合計</b><span class="amt out">${num(r2(rs.reduce((s,r)=>s+r.amt*(r.rate||1),0)))} TWD</span></div>`}
let lastY=0;addEventListener('scroll',()=>{const y=scrollY;$('#fab').classList.toggle('mini',y>lastY&&y>60);lastY=y},{passive:true});
function notice(){
  if(user)return;let seen=false;try{seen=!!localStorage.getItem(SEEN)}catch(e){}
  if(seen)return;
  openSheet(`<h3>先說明一件事</h3><p>沒有登入的話，資料只存在這支手機的瀏覽器裡。清除瀏覽器資料、手機壞掉或換手機，記錄都會消失。</p><p>登入後，資料會存到雲端，手機和電腦都能看，換手機也不怕。</p><div class="acts"><button class="btn alt" data-a="seen">先不登入</button><button class="btn" data-a="login">登入／註冊</button></div>`);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-a]');if(!t)return;
  if(Date.now()-justSwiped<400&&t.classList.contains('row'))return;
  const a=t.dataset.a,id=t.dataset.id;
  if(t.id==='prev'||t.id==='next'){let [y,m]=ym.split('-').map(Number);m+=t.id==='next'?1:-1;if(m<1){m=12;y--}if(m>12){m=1;y++}ym=`${y}-${pad(m)}`;render();return}
  if(t.id==='back'){ym=today().slice(0,7);render();return}
  if(t.id==='fab'){recSheet();return}
  if(t.dataset.k){kind=t.dataset.k;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===kind));fillAcc();fillBud();return}
  if(t.dataset.ad){advSheet(t.dataset.ad,null,advVals());return}
  if(t.dataset.o){accSort=t.dataset.o;accDetail(curAcc);return}
  if(t.dataset.s){adjSign=+t.dataset.s;document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===adjSign));return}
  if(a==='accs')accSheet();
  else if(authAct(a,t))return;
  else if(a==='edit')editRec(id);
  else if(a==='close')closeSheet();
  else if(a==='saverec')saveRec(id,t);
  else if(a==='addacc')addAcc();
  else if(a==='seen'){try{localStorage.setItem(SEEN,'1')}catch(x){}closeSheet();maybeSettle()}
  else if(a==='delrec'&&!t.dataset.armed&&pastRec(id)){t.dataset.armed='1';t.textContent='再按一次確認刪除';$('#err').textContent=WARN}
  else if(a==='delrec'){
    if(t.dataset.armed){S.records=S.records.filter(r=>r.id!==id);save();closeSheet()}
    else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='xnew')xferSheet();
  else if(a==='xsave')xSave(id,t);
  else if(a==='xdel'){if(t.dataset.armed){S.records=S.records.filter(r=>r.id!==id);save();closeSheet()}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='anew')advSheet('advo');
  else if(a==='advsave')advSave(t.dataset.t,id,t);
  else if(a==='advdel'){if(t.dataset.armed){S.records=S.records.filter(r=>r.id!==id);save();closeSheet()}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='adv')advPerson(t.dataset.w,t.dataset.c);
  else if(a==='advrep'){const o=advSum().find(x=>x.who===t.dataset.w&&x.cur===t.dataset.c);advSheet(o&&o.v<0?'reps':'repr',null,{who:t.dataset.w,amt:o?Math.abs(o.v):'',date:today(),note:'',acc:'',cur:t.dataset.c})}
  else if(a==='advnew')advSheet('advo',null,{who:t.dataset.w,amt:'',date:today(),note:'',acc:'',cur:t.dataset.c});
  else if(a==='msettle'){settleSkip=false;const M=pendingSettle();if(M)settleSheet(M);else openSheet(`<h3>月底結算</h3><p>目前沒有需要結算的月份。只有已經過去的月份、而且預算還有剩餘時，才會出現。</p><div class="acts"><button class="btn" data-a="close">關閉</button></div>`)}
  else if(a==='bstart')bStart(id);
  else if(a==='rvlog')rvLogSheet(id,t.dataset.lid);
  else if(a==='rvlsave')rvLogSave(id,t.dataset.lid);
  else if(a==='rvldel'){if(t.dataset.armed){const v=S.reserves.find(x=>x.id===id);v.log=v.log.filter(l=>l.id!==t.dataset.lid);save();rsvSheet(id)}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='rsvedit')rsvEdit(id);
  else if(a==='rsvupd'){const nm=$('#rv-name').value.trim();if(!nm){$('#err').textContent='請輸入項目名稱。';return}S.reserves.find(x=>x.id===id).name=nm;save();rsvSheet(id)}
  else if(a==='rsvdel'){if(t.dataset.armed){const v=S.reserves.find(x=>x.id===id),ac=v.acc;S.records.forEach(r=>{if(r.rsv===id)r.rsv=''});S.reserves=S.reserves.filter(x=>x.id!==id);save();accDetail(ac)}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='rsv')rsvSheet(id);
  else if(a==='rsvnew')rsvNew(id);
  else if(a==='rsvsave')rsvSave(id);
  else if(a==='rvadd')rsvAct(id,'add');
  else if(a==='rvrel')rsvAct(id,'rel');
  else if(a==='rvuse')rsvAct(id,'use');
  else if(a==='settleskip'){settleSkip=true;closeSheet();maybeRemind()}
  else if(a==='settledo')settleDo(id);
  else if(a==='accd')accDetail(id);
  else if(a==='cnew')cardForm();
  else if(a==='cedit')cardForm(id);
  else if(a==='csave')cSave(id);
  else if(a==='card'){id?cardSheet(id):closeSheet()}
  else if(a==='cdel'){if(t.dataset.armed){S.records=S.records.filter(r=>r.card!==id);S.cards=S.cards.filter(c=>c.id!==id);save();closeSheet()}else{t.dataset.armed='1';t.textContent='連同卡片記錄一起刪除，再按一次'}}
  else if(a==='rew'){const c=S.cards.find(x=>x.id===id),v=r2(parseFloat($('#rw-'+t.dataset.w).value.replace(/,/g,'')));if(v>0)c.rew[t.dataset.ck]=v;else delete c.rew[t.dataset.ck];save();cardSheet(id)}
  else if(a==='pay')paySheet(id);
  else if(a==='paysave')paySave(id,t.dataset.rid,t);
  else if(a==='paydel'&&!t.dataset.armed&&pastRec(id)){t.dataset.armed='1';t.textContent='再按一次確認刪除';$('#err').textContent=WARN}
  else if(a==='paydel'){if(t.dataset.armed){S.records=S.records.filter(r=>r.id!==id);save();closeSheet()}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='adje')adjSheet(id,t.dataset.aid);
  else if(a==='bback')bSheet(id);
  else if(a==='adjsave')adjSave(id,t.dataset.aid,t);
  else if(a==='adjdel'){if(t.dataset.armed){const b=S.budgets.find(x=>x.id===id);b.adj=b.adj.filter(x=>x.id!==t.dataset.aid);save();bSheet(id)}else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='bnew')bNew();
  else if(a==='bsave')bSave();
  else if(a==='bud')bSheet(id);
  else if(a==='bbase')bBase(id,t);
  else if(a==='badj')bAdj(id,t);
  else if(a==='bdel'){
    if(t.dataset.armed){S.budgets=S.budgets.filter(x=>x.id!==id);S.records.forEach(r=>{if(r.bud===id)r.bud=''});save();closeSheet()}
    else{t.dataset.armed='1';t.textContent='再按一次確認刪除'}}
  else if(a==='hideacc'){const x=acc(id);x.hidden=!x.hidden;save();accSheet()}
  else if(a==='delacc'){
    if(t.dataset.armed){S.accounts=S.accounts.filter(x=>x.id!==id);S.records=S.records.filter(r=>r.acc!==id&&r.to!==id);S.reserves=S.reserves.filter(v=>v.acc!==id);save();accSheet()}
    else{t.dataset.armed='1';t.textContent=+t.dataset.n?`連同 ${t.dataset.n} 筆記錄一起刪除，再按一次確認`:'再按一次確認刪除'}}
  else if(a==='swdel'&&!t.dataset.armed&&pastRec(id)){t.dataset.armed='1';t.textContent='影響後續月份，再按一次確認'}
  else if(a==='swdel'){
    if(t.dataset.armed){S.records=S.records.filter(r=>r.id!==id);save();render()}
    else{t.dataset.armed='1';t.textContent='再按一次確認'}}
});
let justSwiped=0,sx=0,sy=0,cur=null,moved=false;
function closeSw(s){s.classList.remove('open');const d=s.querySelector('.del');d.textContent='刪除';delete d.dataset.armed}
document.addEventListener('touchstart',e=>{const s=e.target.closest('.sw');
  document.querySelectorAll('.sw.open').forEach(o=>{if(o!==s)closeSw(o)});
  if(!s){cur=null;return}cur=s;sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false},{passive:true});
document.addEventListener('touchmove',e=>{if(!cur)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
  if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy))moved=true},{passive:true});
document.addEventListener('touchend',e=>{if(!cur)return;
  if(moved){const dx=e.changedTouches[0].clientX-sx;justSwiped=Date.now();
    if(dx<-40)cur.classList.add('open');else if(dx>40)closeSw(cur)}
  cur=null},{passive:true});
$('#scrim').addEventListener('click',()=>{if(!$('#sheet').dataset.lock)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden&&!$('#sheet').dataset.lock)closeSheet()});
drawAcct();render();notice();if($('#sheet').hidden)maybeSettle();initSync();
</script>
